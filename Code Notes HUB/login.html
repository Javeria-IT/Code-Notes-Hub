<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CodeNotes Hub</title>

    <link rel="stylesheet" href="css/login.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>
   

    <!-- Background Blur -->
    <div class="bg-circle one"></div>
    <div class="bg-circle two"></div>

    <div class="container">
       
        
        <!-- Left Side -->
        <div class="left">

            <h1>Welcome to Code Notes Hub</h1>

            <p>
                Login to access all coding notes, bookmarks,
                progress tracking and much more.
            </p>

            <img src="https://cdn-icons-png.flaticon.com/512/6062/6062646.png" alt="Student">
             <button id="backBtn">
    <i class="fa-solid fa-arrow-left"></i> Home
</button>
          
        </div>

        <!-- Right Side -->

        <div class="right">
            

            <form id="loginForm">

                <h2>Login</h2>

                <p class="subtitle">Enter your details to continue</p>


                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Email Address"
                        required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required>

                   <button type="button" id="togglePassword">
    <i class="fa-solid fa-eye"></i>
</button>

                </div>

                <div class="remember">

                    <label>

                        <input type="checkbox" id="remember">

                        Remember Me

                    </label>

                </div>

                <button type="submit">

                    Login

                </button>

                <p class="signup">

                    Don't have an account?

                    <a href="register.html">Register</a></p>

            </form>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
